# ============================================================
#  GTG's Backrooms — Gradle Properties (Fabric 1.21.1)
# ============================================================

# --- Project ------------------------------------------------
mod_id=gtgs_backrooms
mod_name=GTG's Backrooms
mod_version=0.9.0
mod_group=com.gtgpuke.gtgsbackrooms
mod_authors=GTGpuke
mod_description=The Backrooms in Minecraft: an endless Level 0 and seamless portals.

# --- Minecraft & Fabric -------------------------------------
# Versions : https://fabricmc.net/develop
minecraft_version=1.21.1
yarn_mappings=1.21.1+build.3
loader_version=0.19.5
fabric_version=0.116.17+1.21.1
loom_version=1.17.21
# Mod de shaders Iris : API publique, a la compilation seulement (compat/iris) ; version du depot Modrinth.
iris_version=1.8.8+1.21.1-fabric

# --- Java & tests -------------------------------------------
java_version=21
junit_version=5.11.4

# --- Gradle -------------------------------------------------
# -Dfile.encoding=COMPAT : obligatoire sur Windows quand le chemin du projet
# contient un caractere accentue, sinon le worker de test ne trouve pas les classes.
org.gradle.jvmargs=-Xmx4G -XX:+UseG1GC -XX:+UseStringDeduplication -Dfile.encoding=COMPAT -Dstdout.encoding=UTF-8 -Dstderr.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.daemon=true
org.gradle.configuration-cache=false
