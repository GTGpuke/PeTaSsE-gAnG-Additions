name: CI

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verification:
    name: Lint, tests, couverture et JAR (Java 21)
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Valider le wrapper Gradle
        uses: gradle/actions/wrapper-validation@v4

      - name: Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/master' }}

      - name: Rendre le wrapper executable
        run: chmod +x ./gradlew

      - name: Conventions du code (Checkstyle, zero warning javac)
        run: ./gradlew checkstyleMain checkstyleTest checkstyleGametest --no-daemon --console=plain --warning-mode all

      - name: Tests unitaires
        run: ./gradlew test --no-daemon --console=plain --warning-mode all

      - name: Tests en jeu (serveur headless, sous agent JaCoCo)
        run: ./gradlew runGameTest --no-daemon --console=plain --warning-mode all

      - name: Couverture fusionnee (100 % des instructions, 96 % des branches)
        run: ./gradlew jacocoFullReport jacocoCoverageVerification --no-daemon --console=plain --warning-mode all

      - name: Build et contenu du JAR (ni dependance embarquee, ni test)
        run: ./gradlew build --no-daemon --console=plain --warning-mode all

      - name: Benchmark de generation du Level 0
        run: ./gradlew benchmarkLevelZeroGeneration --no-daemon --console=plain --warning-mode all

      - name: Publier les JARs
        uses: actions/upload-artifact@v4
        with:
          name: petasse_gang_additions-${{ github.sha }}
          path: build/libs/*.jar
          if-no-files-found: error
          retention-days: 14

      - name: Publier les rapports (Checkstyle, tests, couverture, serveur de test)
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rapports-${{ github.sha }}
          path: |
            build/reports/checkstyle/
            build/reports/tests/test/
            build/reports/jacoco/test/
            build/reports/jacoco/full/
            build/junit.xml
            build/run/gameTest/logs/
          if-no-files-found: ignore
          retention-days: 14
